<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kurumsal Yönlendirme Sayfası</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #0b1f4d 0%, #123a7a 55%, #ffffff 100%);
        color: #0b1f4d;
        display: flex;
        flex-direction: column;
      }

      .logo-area {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 115px; /* 120 → 115 küçültüldü */
        height: auto;
      }

      .logo-area img {
        width: 100%;
        height: auto;
        display: block;
      }

      .wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 100px 20px 40px;
      }

      .card {
        width: 100%;
        max-width: 480px;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 24px;
        padding: 36px 28px;
        box-shadow: 0 20px 60px rgba(7, 24, 61, 0.28);
        border: 1px solid rgba(255, 255, 255, 0.45);
        text-align: center;
      }

      .card h1 {
        font-size: 28px;
        margin-bottom: 10px;
        color: #0b1f4d;
      }

      .card h2 {
        font-size: 28px;
        margin-bottom: 10px;
        color: #0b1f4d;
      }

      .card h2:last-of-type {
        margin-top: 30px;
      }

      .buttons {
        display: grid;
        gap: 14px;
      }

      .buttons a {
        text-decoration: none;
        background: linear-gradient(135deg, #0b1f4d, #174a95);
        color: #ffffff;
        padding: 16px 18px;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.3px;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        box-shadow: 0 10px 24px rgba(11, 31, 77, 0.22);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .buttons a.facebook::before {
        background-image: url("facebook.png");
      }

      .buttons a.linkedin::before {
        background-image: url("link.png");
      }

      .buttons a.instagram::before {
        background-image: url("instagram.png");
      }

      .buttons a.whatsapp::before {
        background-image: url("whatsapp.png");
      }

      .buttons a:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(11, 31, 77, 0.3);
      }

      .buttons a.facebook:hover {
        background: #1877f2;
      }

      .buttons a.linkedin:hover {
        background: #0a66c2;
      }

      .buttons a.instagram:hover {
        background: #e1306c;
      }

      .buttons a.whatsapp:hover {
        background: #25d366;
      }

      .buttons a.join {
        background: #e5221f;
        box-shadow: none;
      }

      .buttons a.join:hover {
        transform: scale(1.03);
        background: #e5221f;
      }

      .catalog-buttons {
        margin: 6px 0 18px;
      }

      @media (max-width: 600px) {
        .logo-area {
          top: 12px;
          left: 12px;
          width: 120px; /* mobilde de 125 → 120 küçültüldü */
          height: 47px;
        }

        .card {
          padding: 28px 18px;
          border-radius: 18px;
        }

        .card h1 {
          font-size: 24px;
        }

        .card h2 {
          font-size: 24px;
        }

        .buttons a {
          padding: 15px 16px;
          font-size: 15px;
        }
      }
    </style>
  </head>

  <body>
    <div class="logo-area">
      <img src="erpalogo.png" alt="ERPA Logo" />
    </div>

    <div class="wrapper">
      <div class="card">
        <h2>Çözümlerimiz ile Tanışın.</h2>

        <div class="buttons catalog-buttons">
          <a href="Profesyonel%20G%C3%B6r%C3%BCnt%C3%BCleme%20Sistemleri.pdf" target="_blank" rel="noopener noreferrer">
            TOCHI Profesyonel Görüntüleme Sistemleri
          </a>
        </div>

        <h1>Bize Ulaşın</h1>

        <div class="buttons">
          <a class="facebook" href="https://www.facebook.com/p/erpateknoloji-100068405018825/" target="_self" rel="noopener noreferrer">Facebook</a>
          <a class="linkedin" href="https://www.linkedin.com/company/erpa-teknoloji" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a class="instagram" href="https://www.instagram.com/erpa.teknoloji/" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a class="whatsapp" href="https://wa.me/905322893679" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        </div>

        <h2>Kariyerin burada başlar.</h2>

        <div class="buttons">
          <a class="join" href="https://docs.google.com/forms/d/1fK5Dn1eebFqX_4Pz_NjS-MSwmHbhYLBLMcEo_IPbqAc/edit" target="_blank" rel="noopener noreferrer">
            Sende Bize Katıl
          </a>
        </div>

      </div>
    </div>
  </body>
</html>
